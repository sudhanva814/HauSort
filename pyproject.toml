[project]
name = "hausort"
version = "0.1.0"
description = "FastAPI backend application for HauSort"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "playwright>=1.64.0",
    "pytest-playwright>=0.10.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.48",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


